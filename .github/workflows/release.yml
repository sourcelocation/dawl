name: Release

# See sourcelocation/.github's AGENTS.md.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: sourcelocation/.github/.github/workflows/release.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
    secrets: inherit

  # So `go get` finds the version at once rather than whenever the proxy next looks.
  go-proxy:
    name: Announce it to the Go module proxy
    if: needs.release.outputs.release_created == 'true'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - env:
          TAG: ${{ needs.release.outputs.tag }}
        run: curl -fsS --retry 5 --retry-all-errors "https://proxy.golang.org/github.com/sourcelocation/dawl/@v/$TAG.info"
